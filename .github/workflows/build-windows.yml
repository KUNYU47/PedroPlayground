name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (dist/)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build single-file executable
        run: pyinstaller build_windows.spec --noconfirm --clean

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\PedroPlayground.exe `
                -ArgumentList '--no-browser','--port','8489' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8489/' -UseBasicParsing -TimeoutSec 2
                $ok = ($r.StatusCode -eq 200)
              } catch {}
            }
            if (-not $ok) { throw 'Server did not respond on port 8489' }
            Write-Host 'Smoke test passed: server responded with 200'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PedroPlayground-windows
          path: dist/PedroPlayground.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PedroPlayground.exe
